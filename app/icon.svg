<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141e33"/>
      <stop offset="70%" stop-color="#0b101d"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo Arredondado Escuro Cyber -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Anel Externo Neon Radar -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="24 12" opacity="0.4"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.6"/>
  <circle cx="256" cy="256" r="85" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Mira Retículo Sniper (Crosshair) -->
  <line x1="256" y1="40" x2="256" y2="135" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="377" x2="256" y2="472" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
  <line x1="40" y1="256" x2="135" y2="256" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
  <line x1="377" y1="256" x2="472" y2="256" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Marcadores Angulares da Mira -->
  <path d="M 200 200 L 220 200 M 200 200 L 200 220" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <path d="M 312 200 L 292 200 M 312 200 L 312 220" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <path d="M 200 312 L 220 312 M 200 312 L 200 292" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <path d="M 312 312 L 292 312 M 312 312 L 312 292" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>

  <!-- Núcleo Central de Disparo Atômico -->
  <circle cx="256" cy="256" r="26" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="10" fill="#ffffff"/>

  <!-- Raio Scalp Flash -->
  <path d="M 270 95 L 246 130 L 262 130 L 242 165" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
